{% extends 'base.html' %}{% block title %}{{ heading }}{% endblock %}{% block content %}<section class="editor-wrap"><a class="back-link" href="{{ url_for('notes') }}">← Back to my notes</a><div class="eyebrow">A THOUGHT WORTH KEEPING</div><h1>{{ heading }}<span class="heading-period">.</span></h1><form class="panel editor" method="post">{{ csrf_token() }}<label for="title">Title</label><input id="title" name="title" maxlength="120" required value="{{ note.title if note else '' }}" placeholder="Give this note a title"><label for="body">Your note</label><textarea id="body" name="body" maxlength="10000" rows="9" placeholder="Let the thought land here...">{{ note.body if note else '' }}</textarea><div class="editor-actions"><a class="button ghost" href="{{ url_for('notes') }}">Cancel</a><button class="button primary" type="submit">Save note <span>↗</span></button></div></form></section>{% endblock %}
